<!-- Top Navigation Anchor -->
<header class="w-full top-0 sticky bg-gradient-to-b from-[#f8f9fa] to-transparent z-50">

</div>
<h1 class="font-['Manrope','PingFang_SC'] text-lg tracking-wider font-light text-[#506070]">设备配对</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</div>
</header>
<main class="min-h-[calc(100vh-64px)] flex flex-col items-center justify-center px-6 pb-24 relative overflow-hidden">
<!-- Abstract Background Light Elements -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-primary-container/20 rounded-full blur-[120px] -z-10"></div>
<!-- Success Celebration Icon & Halo -->
<div class="relative flex items-center justify-center mb-12">
<div class="absolute w-48 h-48 rounded-full halo-ring"></div>
<div class="absolute w-32 h-32 rounded-full halo-ring" style="animation-delay: 1s;"></div>
<div class="w-20 h-20 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-sm relative z-10">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Headline & Code Section -->
<div class="text-center space-y-8 max-w-md w-full">
<div class="space-y-2">
<h2 class="text-on-surface-variant font-light tracking-[0.2em] text-sm uppercase">Connection Successful</h2>
<p class="text-primary font-medium text-lg">配网成功</p>
</div>
<!-- 6-Digit Auth Code -->
<div class="py-10 bg-surface-container-lowest/40 backdrop-blur-md rounded-[2.5rem] border border-white/40 shadow-sm relative overflow-hidden group">
<div class="relative z-10">
<span class="block text-6xl md:text-7xl font-extralight tracking-[0.15em] text-primary lunar-text-glow font-headline">
                        882 966
                    </span>
</div>
<!-- Glass Reflection -->
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-transparent pointer-events-none"></div>
</div>
<div class="space-y-6">
<p class="text-on-surface-variant font-light text-sm leading-relaxed px-8">
                    请妥善保存此授权码，用于连接 PWA
                </p>
<!-- Minimal Copy Button -->
<button class="inline-flex items-center space-x-2 px-6 py-3 rounded-full bg-surface-container-high text-primary text-sm font-medium hover:bg-surface-container-highest transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-sm">content_copy</span>
<span>复制授权码</span>
</button>
</div>
</div>
<!-- Secondary Info & Main Action -->
<div class="mt-20 w-full max-w-sm space-y-8">
<div class="flex flex-col items-center space-y-1">
<span class="text-[10px] text-outline-variant tracking-widest uppercase">Device Identity</span>
<span class="text-on-surface-variant font-['Manrope'] text-xs font-light">YSHU-2024-OX2</span>
</div>
<button class="w-full py-5 rounded-full bg-gradient-to-br from-primary to-primary-dim text-on-primary font-medium tracking-wide shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all duration-300">
                完成配网，安装应用
            </button>
</div>

<span class="text-[10px] font-['Manrope'] tracking-[0.05em] uppercase hidden">授权</span>
</div>

<span class="material-symbols-outlined mb-1">install_mobile</span>
