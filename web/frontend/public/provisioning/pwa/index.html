<!DOCTYPE html>

<html lang="zh-CN"><head>

<style>
        body {
            font-family: 'Manrope', 'Noto Sans SC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .lunar-halo {
            box-shadow: 0 0 40px 5px rgba(80, 96, 112, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Anchor -->
<header class="w-full top-0 sticky bg-gradient-to-b from-[#f8f9fa] to-transparent z-50">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#d4e4f7]/30 transition-colors active:scale-95 duration-300">
<span class="material-symbols-outlined text-[#506070]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Manrope','PingFang_SC'] text-lg tracking-wider font-light text-[#506070]">设备配对</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
</header>
<main class="flex-grow flex flex-col items-center px-6 pt-8 pb-32 max-w-lg mx-auto w-full">
<!-- Hero Section -->
<section class="text-center mb-12">
<div class="mb-6 inline-flex p-4 rounded-full bg-primary-container/30">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="install_mobile" style="font-variation-settings: 'FILL' 0;">install_mobile</span>
</div>
<h2 class="text-3xl font-light tracking-tight text-primary mb-4">添加月枢到桌面</h2>
<p class="text-on-surface-variant text-sm leading-relaxed max-w-xs mx-auto">
                安装后即可解锁完整的设备发现与控制功能，享受更纯净的交互体验。
            </p>
</section>
<!-- Bento Instructions Grid -->
<div class="grid grid-cols-1 gap-6 w-full">
<!-- iOS Instructions -->
<div class="glass-card border border-white/40 rounded-3xl p-6 lunar-halo flex flex-col gap-6">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/60 text-xl" data-icon="phone_iphone">phone_iphone</span>
<span class="text-xs uppercase tracking-[0.2em] font-medium text-outline">iOS 指引</span>
</div>
<div class="flex items-start gap-4">
<div class="flex-grow space-y-4">
<div class="flex items-center gap-4">
<span class="flex-shrink-0 w-6 h-6 rounded-full bg-primary text-white text-[10px] flex items-center justify-center font-bold">01</span>
<p class="text-sm text-on-surface">点击浏览器底部的 <span class="inline-flex items-center px-1.5 py-0.5 rounded bg-surface-container-high border border-outline-variant/20"><span class="material-symbols-outlined text-sm" data-icon="ios_share">ios_share</span></span> 分享图标</p>
</div>
<div class="flex items-center gap-4">
<span class="flex-shrink-0 w-6 h-6 rounded-full bg-primary text-white text-[10px] flex items-center justify-center font-bold">02</span>
<p class="text-sm text-on-surface">向上滑动并选择 <span class="font-medium text-primary">“添加到主屏幕”</span></p>
</div>
</div>
<div class="flex-shrink-0 w-24 h-24 bg-surface-container-low rounded-2xl overflow-hidden border border-white/60">
<img alt="iOS Install Step" class="w-full h-full object-cover mix-blend-multiply opacity-80" data-alt="Minimalist iOS share menu step illustration" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBLsTZH2ajk8ljIYCjLzeO2nA195WEIYMinyN-taiVFyfvGKo9dfrN8LWU-6y3kJ1gP_Q_jC9lonfy3rXBdswMchXwYQsUddTifPinEYNkcLG-e9UG-n_Xoh4MmhX8hwHg_kmc8Iet0kJthXQBQ0ttf1W_JbVhZUzRgU0sJtanMJioXKn3fihikI8l77ttsQLE_jTYWH1U5xJ013D0zr9JqyBuq739VFVqGVVKDNphSxyfUfQwHzt9QPx5TcaLy6ItiHKu1dMIW788"/>
</div>
</div>
</div>
<!-- Android Instructions -->
<div class="glass-card border border-white/40 rounded-3xl p-6 lunar-halo flex flex-col gap-6">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/60 text-xl" data-icon="phone_android">phone_android</span>
<span class="text-xs uppercase tracking-[0.2em] font-medium text-outline">Android 指引</span>
</div>
<div class="flex items-start gap-4">
<div class="flex-grow space-y-4">
<div class="flex items-center gap-4">
<span class="flex-shrink-0 w-6 h-6 rounded-full bg-primary text-white text-[10px] flex items-center justify-center font-bold">01</span>
<p class="text-sm text-on-surface">点击右上角或底部的 <span class="inline-flex items-center px-1.5 py-0.5 rounded bg-surface-container-high border border-outline-variant/20"><span class="material-symbols-outlined text-sm" data-icon="more_vert">more_vert</span></span> 菜单图标</p>
</div>
<div class="flex items-center gap-4">
<span class="flex-shrink-0 w-6 h-6 rounded-full bg-primary text-white text-[10px] flex items-center justify-center font-bold">02</span>
<p class="text-sm text-on-surface">在菜单中点击 <span class="font-medium text-primary">“安装应用”</span></p>
</div>
</div>
<div class="flex-shrink-0 w-24 h-24 bg-surface-container-low rounded-2xl overflow-hidden border border-white/60">
<img alt="Android Install Step" class="w-full h-full object-cover mix-blend-multiply opacity-80" data-alt="Minimalist Android menu install step illustration" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAVi2APWUQ7nViJYdQPWKNLh3ihAAfQXFbN_IdDWFHrb51W8cpkmB7MgSsotjJiQ68JRJhxRtN7LBrBhazlKIDhv2uh1Nx28aUnqamW_HFQLHXGodzcx-dIkPtjML0KqnOwHA4i3wWHvgu_RGTM74EHbZobdzqpN3kwCQwhdBDUtYap72icJgGw0fcU8ljRISECaODZAgUoEeeH4eHWak6_whtIP0NklduVo8iHLwvtkYdlvPb0NVJulNhBERMS_xwfvXksVB8DqTE"/>
</div>
</div>
</div>
</div>
<!-- Status Check Action -->
<button class="mt-10 group flex items-center gap-3 px-6 py-3 rounded-full border border-primary/20 hover:bg-primary/5 transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined text-primary text-xl" data-icon="search_check">search_check</span>
<span class="text-sm font-medium text-primary">检测安装状态</span>
</button>
</main>
<!-- Bottom Actions & Navigation Shell -->
<div class="fixed bottom-0 left-0 w-full z-50 flex flex-col items-center">
<!-- Floating Primary Action -->
<div class="px-6 pb-6 w-full max-w-lg">
<button class="w-full h-14 bg-gradient-to-br from-[#506070] to-[#708090] text-white rounded-2xl shadow-lg shadow-[#506070]/20 flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all duration-300">
<span class="font-medium tracking-wide">我已安装，开始使用</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Semantic Navigation Shell (Installation Context) -->
<nav class="w-full bg-white/40 backdrop-blur-xl border-t border-white/20 rounded-t-[2rem] px-8 pb-8 pt-4 flex justify-around items-center shadow-[0_-8px_30px_rgb(0,0,0,0.04)]">
<div class="flex flex-col items-center justify-center text-[#abb3b7] hover:text-[#506070] transition-opacity">
<span class="material-symbols-outlined" data-icon="wifi">wifi</span>
<span class="text-[11px] font-['Manrope'] tracking-[0.1em] uppercase mt-1">连接</span>
</div>
<div class="flex flex-col items-center justify-center text-[#abb3b7] hover:text-[#506070] transition-opacity">
<span class="material-symbols-outlined" data-icon="vpn_key">vpn_key</span>
<span class="text-[11px] font-['Manrope'] tracking-[0.1em] uppercase mt-1">授权</span>
</div>
<div class="flex flex-col items-center justify-center bg-gradient-to-br from-[#506070] to-[#708090] text-white rounded-full w-14 h-14 shadow-lg shadow-[#506070]/20">
<span class="material-symbols-outlined" data-icon="install_mobile" style="font-variation-settings: 'FILL' 1;">install_mobile</span>
<span class="text-[9px] font-['Manrope'] tracking-[0.05em] uppercase mt-0.5">安装</span>
</div>
</nav>
</div>
<!-- Ambient Glow Background Decor -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[40%] rounded-full bg-primary-container/10 blur-[100px]"></div>
</div>
</body></html>
