services:
  # ─────────────────────────────────────────────
  # MoonHub Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm moonhub-agent -m "Hello"
  # ─────────────────────────────────────────────
  moonhub-agent:
    image: docker.io/sipeed/moonhub:latest
    container_name: moonhub-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.moonhub
    entrypoint: ["moonhub", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # MoonHub Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  moonhub-gateway:
    image: docker.io/sipeed/moonhub:latest
    container_name: moonhub-gateway
    restart: on-failure
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.moonhub

  # ─────────────────────────────────────────────
  # MoonHub Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  moonhub-launcher:
    image: docker.io/sipeed/moonhub:launcher
    container_name: moonhub-launcher
    restart: on-failure
    profiles:
      - launcher
    environment:
      - MOONHUB_GATEWAY_HOST=0.0.0.0
    ports:
      - "127.0.0.1:18800:18800"
      - "127.0.0.1:18790:18790"
    volumes:
      - ./data:/root/.moonhub
